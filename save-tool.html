<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GachAlexia Save Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #1a0518, #0d020e);
    color: #f0d7ea;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: min(680px, 100%);
    background: linear-gradient(180deg, rgba(60, 0, 52, 0.6), rgba(24, 0, 22, 0.8));
    border: 1px solid rgba(215, 70, 180, 0.45);
    border-radius: 18px;
    padding: 32px 36px;
    box-shadow: 0 0 50px rgba(180, 20, 150, 0.25);
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    background: linear-gradient(100deg, #d455b8, #c21590, #7e46c2, #c21590, #d455b8);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub { font-size: 13px; color: rgba(240, 180, 225, 0.55); margin-bottom: 22px; }
  .drop {
    border: 2px dashed rgba(215, 70, 180, 0.45);
    border-radius: 14px;
    padding: 34px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-bottom: 18px;
  }
  .drop:hover, .drop.over {
    border-color: rgba(240, 130, 215, 0.9);
    background: rgba(200, 25, 160, 0.08);
  }
  .drop p { font-size: 14px; color: rgba(240, 200, 230, 0.8); }
  .drop .fileName { margin-top: 8px; font-size: 13px; color: #e88ad2; word-break: break-all; }
  textarea {
    width: 100%;
    height: 260px;
    background: rgba(10, 2, 10, 0.7);
    color: #f5dff0;
    border: 1px solid rgba(215, 70, 180, 0.35);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 12.5px;
    line-height: 1.5;
    resize: vertical;
    margin-bottom: 16px;
  }
  textarea:focus { outline: none; border-color: rgba(240, 130, 215, 0.8); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    flex: 1;
    min-width: 140px;
    padding: 12px 18px;
    border-radius: 999px;
    border: 1px solid rgba(215, 70, 180, 0.65);
    background: linear-gradient(180deg, rgba(140, 0, 115, 0.25), rgba(140, 0, 115, 0.1));
    color: rgb(240, 165, 220);
    font-size: 14px;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  button:hover:not(:disabled) {
    color: #ffe3f6;
    border-color: rgba(240, 130, 215, 0.95);
    background: linear-gradient(180deg, rgba(200, 25, 160, 0.35), rgba(140, 0, 115, 0.15));
    transform: translateY(-1px);
  }
  button:disabled { opacity: 0.35; cursor: default; }
  #status {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    color: #e88ad2;
  }
  #status.err { color: #ff7b8a; }
</style>
</head>
<body>
<div class="card">
  <h1>✦ GachAlexia Save Tool ✦</h1>
  <p class="sub">decode .alexia saves to editable JSON · encode them back when you're done~</p>

  <div class="drop" id="drop">
    <p>📂 Drop a save file here or click to browse</p>
    <p class="fileName" id="fileName"></p>
    <input type="file" id="fileInput" accept=".alexia,.json" style="display:none">
  </div>

  <textarea id="editor" placeholder="decoded save JSON appears here — edit away~" spellcheck="false"></textarea>

  <div class="row">
    <button id="decodeBtn" disabled>🔓 Decode</button>
    <button id="encodeBtn" disabled>🔒 Encode &amp; Download</button>
    <button id="prettyBtn" disabled>✨ Pretty-print</button>
  </div>

  <p id="status"></p>
</div>

<script>
const SAVE_PREFIX = 'GACHALEXIA1:';
const SAVE_KEY = [0x41, 0x6c, 0x65, 0x78, 0x69, 0x61, 0x47, 0x61,
                  0x63, 0x68, 0x61, 0x53, 0x61, 0x76, 0x65, 0x21];

function deobfuscate(text) {
  const t = text.trim();
  if (!t.startsWith(SAVE_PREFIX)) return t;
  const bin = atob(t.slice(SAVE_PREFIX.length));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ SAVE_KEY[i % SAVE_KEY.length];
  return new TextDecoder().decode(bytes);
}

function obfuscate(plainText) {
  const bytes = new TextEncoder().encode(plainText);
  for (let i = 0; i < bytes.length; i++) bytes[i] ^= SAVE_KEY[i % SAVE_KEY.length];
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return SAVE_PREFIX + btoa(bin);
}

const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const fileName = document.getElementById('fileName');
const editor = document.getElementById('editor');
const status = document.getElementById('status');
const decodeBtn = document.getElementById('decodeBtn');
const encodeBtn = document.getElementById('encodeBtn');
const prettyBtn = document.getElementById('prettyBtn');

let rawFileText = null;
let baseName = 'gachalexia-progress';

function setStatus(msg, isErr) {
  status.textContent = msg;
  status.className = isErr ? 'err' : '';
}

function loadFile(f) {
  if (!f) return;
  baseName = f.name.replace(/\.(alexia|json)$/i, '');
  const reader = new FileReader();
  reader.onload = () => {
    rawFileText = reader.result;
    fileName.textContent = f.name;
    decodeBtn.disabled = false;
    setStatus('file loaded — hit Decode~');
    // auto-decode on drop for convenience
    doDecode();
  };
  reader.readAsText(f);
}

function doDecode() {
  if (!rawFileText) return;
  try {
    const plain = deobfuscate(rawFileText);
    editor.value = JSON.stringify(JSON.parse(plain), null, 2);
    encodeBtn.disabled = false;
    prettyBtn.disabled = false;
    setStatus('decoded ✓ edit below, then Encode & Download~');
  } catch (e) {
    setStatus('could not decode — corrupt or wrong file?', true);
  }
}

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  loadFile(e.dataTransfer.files[0]);
});

decodeBtn.addEventListener('click', doDecode);

prettyBtn.addEventListener('click', () => {
  try {
    editor.value = JSON.stringify(JSON.parse(editor.value), null, 2);
    setStatus('prettified ✓');
  } catch (e) {
    setStatus('invalid JSON — fix it first~', true);
  }
});

encodeBtn.addEventListener('click', () => {
  let parsed;
  try { parsed = JSON.parse(editor.value); }
  catch (e) { setStatus('invalid JSON — fix it first~', true); return; }
  const blob = new Blob([obfuscate(JSON.stringify(parsed))], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = baseName + '.alexia';
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus('encoded ✓ downloaded ' + baseName + '.alexia — import it in the popup~');
});
</script>
</body>
</html>
